<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090407"><title>ZAVYNIX — Coming January 1, 2027</title><style>
:root{--red:#ff2647;--black:#090407;--white:#fff5f6;--muted:#e0aeb6}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#050305;color:var(--white);font-family:Arial,Helvetica,sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:28px;overflow:hidden;position:relative;background:radial-gradient(circle at 78% 12%,rgba(255,38,71,.2),transparent 26%),var(--black)}.moon{position:absolute;width:min(60vw,510px);aspect-ratio:1;border-radius:50%;top:-19vw;right:-19vw;background:radial-gradient(circle at 39% 36%,#ff9aa7 0 3%,#ff2647 5% 38%,#a0001d 70%,#3c000a 100%);box-shadow:0 0 65px #ff2647,0 0 180px rgba(255,38,71,.55)}.wrap{position:relative;z-index:1;width:min(100%,660px);text-align:center}.badge{display:inline-block;border:1px solid var(--red);border-radius:99px;padding:8px 12px;color:#ffc4cc;font-size:.74rem;font-weight:900;letter-spacing:.13em}.brand{margin:27px 0 5px;font-size:clamp(4rem,15vw,8rem);line-height:.8;letter-spacing:-.12em;font-weight:1000}.brand span{color:var(--red)}h1{font-size:clamp(1.6rem,5vw,2.5rem);margin:27px 0 12px;letter-spacing:-.055em}.lead{margin:0 auto 29px;max-width:500px;color:var(--muted);font-size:1.1rem;line-height:1.5}.form{display:flex;gap:10px;max-width:520px;margin:auto}.form input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(0,0,0,.45);padding:16px;color:#fff;font-size:1rem}.form button{border:0;border-radius:14px;background:var(--red);color:#250005;padding:0 19px;font-size:.95rem;font-weight:950;cursor:pointer}.note{margin-top:14px;color:#c9929b;font-size:.76rem;line-height:1.45}.status{min-height:22px;color:#ffb1bb;font-weight:800;margin:16px 0 0}.footer{margin-top:52px;font-size:.72rem;color:#a8757d}@media(max-width:520px){.form{display:grid}.form button{min-height:53px}.moon{width:320px;top:-95px;right:-118px}}
</style></head><body><main><div class="moon" aria-hidden="true"></div><div class="wrap"><div class="badge">18+ EARLY ACCESS</div><div class="brand">ZAVY<span>NIX</span></div><h1>Coming January 1, 2027</h1><p class="lead">Real takes after the filter. Join the early-access list for the first drop of invites.</p><form class="form" id="waitlist"><input id="email" type="email" autocomplete="email" placeholder="Enter your email" required aria-label="Email address"><button>Join the waitlist</button></form><div class="status" id="status" aria-live="polite"></div><p class="note">Zavynix is for adults 18+. We’ll only email you about early access and launch updates.</p><p class="footer">© 2026 Zavynix. All rights reserved.</p></div></main><script>document.querySelector('#waitlist').addEventListener('submit',e=>{e.preventDefault();const email=document.querySelector('#email').value.trim();document.querySelector('#status').textContent=email?'You’re on the list. Watch your inbox for Zavynix updates.':'Enter a valid email to join.';e.target.reset()})</script></body></html>
